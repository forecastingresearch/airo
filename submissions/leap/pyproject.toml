[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leap-submission"
version = "0.1.0"
description = "LEAP survey waves: ask the panel, pool, and write the submission file"
requires-python = ">=3.11"
# Stdlib only, plus the engine installed beside it
# (pip install -e ../../packages/forecaster).
dependencies = []

[tool.setuptools]
packages = ["leap"]
