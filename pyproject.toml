# automated-forecasting-monorepo: the workspace root. Nothing is built from
# here; each project is its own distribution, installed from its directory:
#
#   pip install -e packages/forecaster -e packages/dashboard -e dashboards/airo -e dashboards/eeai -e submissions/forecastbench
#
#   packages/forecaster         fri-forecaster: the engine every project forecasts with
#   packages/dashboard          fri-dashboard: the kit every dashboard's site is made of
#   dashboards/airo             redlines: the AIRO dashboard
#   dashboards/eeai             eeai: the Economic Effects of AI dashboard
#   submissions/forecastbench   forecastbench: the ForecastBench rounds
#   packages/ops                the production scheduler (a script, not installed)

[tool.pytest.ini_options]
# Every project's tests. The engine's run pi_tools.ts through the pinned pi
# against a scripted model: `npm ci` in packages/forecaster first, else those
# skip. dashboards/airo/archive carries files pytest would otherwise collect.
testpaths = [
    "packages/forecaster/tests",
    "packages/dashboard/tests",
    "packages/ops/tests",
    "dashboards/airo/tests",
    "dashboards/eeai/eeai/tests",
    "submissions/forecastbench/tests",
]

[tool.uv.workspace]
members = ["packages/forecaster", "packages/dashboard", "dashboards/airo", "dashboards/eeai", "submissions/forecastbench"]
