[project]
name = "redlines"
version = "0.1.0"
description = "Automated Catastrophic Risk Forecasting — dashboard data pipeline"
requires-python = ">=3.11"
license = {file = "LICENSE"}
# The build stage (python3 -m redlines build) is stdlib-only by design:
# rebuilding every dashboard blob must never need API keys or third-party deps.
dependencies = []

[project.optional-dependencies]
paper = [
    "matplotlib>=3.9",
]
# The pi loop (redlines/pi_loop.py; the only loop since 2026-10-22): the
# FRI Forecaster harness, which drives pi 0.99.2 -- FORECASTER_PI names its
# cli.js. Since 2026-10-19 it lives in this repository, packages/fri-forecaster
# (a uv workspace member, [tool.uv.sources]); with plain pip install it from
# the path: pip install -e ./packages/fri-forecaster
pi = [
    "fri-forecaster",
]
# Running the test suite: pytest, plus openpyxl for the question-set generator
# tests (tests/test_autoarc_generator.py reads the Auto-ARC workbook).
test = [
    "pytest>=8",
    "openpyxl>=3.1",
]

[tool.pytest.ini_options]
# Two test suites: AIRO's and the harness's (packages/fri-forecaster/tests,
# which runs pi_tools.ts through the pinned pi against a scripted model --
# `npm ci` in that directory first, else those tests skip). archive/ and the
# vendored archive/causal/ carry files pytest would otherwise try to collect.
testpaths = ["tests", "packages/fri-forecaster/tests"]

[tool.setuptools]
packages = ["redlines", "redlines.views", "redlines.paper"]

# One repository, two distributions: this one (redlines, the dashboard
# pipeline) and packages/fri-forecaster (the harness), which other projects
# install on its own.
[tool.uv.workspace]
members = ["packages/fri-forecaster"]

[tool.uv.sources]
fri-forecaster = { workspace = true }
